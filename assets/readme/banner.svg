<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t">
  <title id="t">Kauã Vasco, Desenvolvedor Backend Python Júnior</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; dominant-baseline: middle; }
    /* Cada linha entra uma vez e fica. Sem o `both`, o estado padrão (visível) vale quando a animação não roda. */
    @keyframes in { from { opacity: 0; transform: translateY(4px); } }
    @keyframes blink { 50% { opacity: 0; } }
    .l { animation: in .5s ease-out both; }
    .c { animation: blink 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .l, .c { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#16241b"/>
    </pattern>
  </defs>

  <rect x=".5" y=".5" width="719" height="299" rx="12" fill="#0a0d0b" stroke="#1c2a21"/>
  <rect x="1" y="38" width="718" height="261" fill="url(#grid)"/>

  <!-- trilhas de circuito, só decoração e bem discretas -->
  <g fill="none" stroke="#1d3a28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 258 H560 L584 234 H650 L670 214 H692"/>
    <path d="M520 282 H610 L630 262 H692"/>
    <path d="M604 84 V126 L624 146 V190"/>
  </g>
  <g fill="#2f6b45">
    <circle cx="692" cy="214" r="3"/>
    <circle cx="692" cy="262" r="3"/>
    <circle cx="624" cy="190" r="3"/>
  </g>

  <!-- barra de título -->
  <path d="M1 38 H719" stroke="#17231b"/>
  <g fill="#1f2d24"><circle cx="24" cy="19" r="5"/><circle cx="42" cy="19" r="5"/></g>
  <circle cx="60" cy="19" r="5" fill="#2f6b45"/>
  <text x="360" y="20" font-size="12" text-anchor="middle" fill="#55645a">kaua@backend: ~</text>

  <g class="l" style="animation-delay:.2s">
    <text x="36" y="76" font-size="16" fill="#3ddc84">$</text>
    <text x="54" y="76" font-size="16" fill="#c9d1d9">whoami</text>
  </g>
  <text class="l" style="animation-delay:.7s" x="36" y="122" font-size="40" font-weight="700" fill="#e6edf3">Kauã Vasco</text>
  <text class="l" style="animation-delay:1s" x="36" y="158" font-size="19" fill="#3ddc84">Desenvolvedor Backend Python Júnior</text>

  <g class="l" style="animation-delay:1.5s">
    <text x="36" y="202" font-size="16" fill="#3ddc84">$</text>
    <text x="54" y="202" font-size="16" fill="#c9d1d9">cat stack.txt</text>
  </g>
  <text class="l" style="animation-delay:1.9s" x="36" y="230" font-size="15" fill="#8b949e">python · fastapi · sqlalchemy · pydantic · mysql · n8n</text>

  <g class="l" style="animation-delay:2.4s">
    <text x="36" y="268" font-size="16" fill="#3ddc84">$</text>
    <rect class="c" x="54" y="260" width="9" height="17" fill="#3ddc84"/>
  </g>
</svg>
