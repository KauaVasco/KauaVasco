<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t">
  <title id="t">Kauã Vasco, Desenvolvedor Backend Python Júnior</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; dominant-baseline: middle; }
    /* Só a linha de mensagens e o cursor se mexem. O resto é estático, então nome, cargo e stack continuam legíveis sem animação. */
    @keyframes tick { 0% { opacity: 0; } 5%, 30% { opacity: 1; } 35%, 100% { opacity: 0; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    .m1 { opacity: 1; }
    .m2, .m3 { opacity: 0; }
    .m { animation: tick 9s ease-in-out infinite both; }
    .k { animation: blink 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .m, .k { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#16241b"/>
    </pattern>
  </defs>

  <rect x=".5" y=".5" width="719" height="329" rx="12" fill="#0a0d0b" stroke="#1c2a21"/>
  <rect x="1" y="38" width="718" height="291" fill="url(#grid)"/>

  <!-- trilhas de circuito, só decoração e longe do texto -->
  <g fill="none" stroke="#1d3a28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M604 64 V112 L624 132 V186"/>
    <path d="M672 64 V96 L692 116"/>
    <path d="M640 322 V270 L660 250 H692"/>
  </g>
  <g fill="#2f6b45">
    <circle cx="624" cy="186" r="3"/>
    <circle cx="692" cy="116" r="3"/>
    <circle cx="692" cy="250" r="3"/>
  </g>

  <!-- barra de título -->
  <path d="M1 38 H719" stroke="#17231b"/>
  <g fill="#1f2d24"><circle cx="24" cy="19" r="5"/><circle cx="42" cy="19" r="5"/></g>
  <circle cx="60" cy="19" r="5" fill="#2f6b45"/>
  <text x="360" y="20" font-size="12" text-anchor="middle" fill="#55645a">kaua@backend: ~</text>

  <!-- conteúdo principal, sem animação -->
  <text x="36" y="82" font-size="18"><tspan fill="#3ddc84">kaua@backend</tspan><tspan fill="#6b7a70">:~$</tspan> <tspan fill="#c9d1d9">whoami</tspan></text>
  <text x="36" y="138" font-size="46" font-weight="700" fill="#e6edf3">Kauã Vasco</text>
  <text x="36" y="176" font-size="22" fill="#3ddc84">Desenvolvedor Backend Python Júnior</text>

  <text x="36" y="222" font-size="18"><tspan fill="#3ddc84">$</tspan> <tspan fill="#c9d1d9">cat stack.txt</tspan></text>
  <text x="36" y="252" font-size="18" fill="#8b949e">python · fastapi · sqlalchemy · pydantic · mysql · n8n</text>

  <!-- linha animada: três mensagens em rotação, cada uma com o cursor no fim -->
  <text x="36" y="292" font-size="18" fill="#6b7a70">&gt;</text>
  <text class="m m1" x="58" y="292" font-size="18" fill="#c9d1d9">Construindo APIs em Python<tspan class="k" fill="#3ddc84"> █</tspan></text>
  <text class="m m2" style="animation-delay:3s" x="58" y="292" font-size="18" fill="#c9d1d9">Automatizando fluxos de trabalho<tspan class="k" fill="#3ddc84"> █</tspan></text>
  <text class="m m3" style="animation-delay:6s" x="58" y="292" font-size="18" fill="#c9d1d9">Integrando IA a sistemas<tspan class="k" fill="#3ddc84"> █</tspan></text>
</svg>
